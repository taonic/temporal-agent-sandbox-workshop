<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Max{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #f7f5f2; --card: #ffffff; --ink: #1d1b19; --muted: #6f6a64; --line: #e6e1da;
      --accent: #4f46e5; --accent-ink: #ffffff; --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
      --sleep: #475569; --sleep-bg: #e2e8f0; --bad: #b91c1c; --bad-bg: #fee2e2; --code: #f3f1ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514; --card: #201f1d; --ink: #f1eee9; --muted: #a39d95; --line: #34312d;
        --accent: #818cf8; --accent-ink: #11111b; --ok: #4ade80; --ok-bg: #14301f; --warn: #fbbf24; --warn-bg: #3a2c0b;
        --sleep: #cbd5e1; --sleep-bg: #2a313b; --bad: #f87171; --bad-bg: #3b1515; --code: #191816;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
    header .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; }
    header nav { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    textarea { width: 100%; min-height: 90px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
    button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 8px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    button.danger { color: var(--bad); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sleep-bg); color: var(--sleep); }
    .pill.running, .pill.analyzing, .pill.completed, .pill.done { background: var(--ok-bg); color: var(--ok); }
    .pill.awaiting_approval, .pill.resuming, .pill.suspending, .pill.creating, .pill.publishing, .pill.starting { background: var(--warn-bg); color: var(--warn); }
    .pill.failed, .pill.canceled, .pill.terminated, .pill.deleted, .pill.stopping { background: var(--bad-bg); color: var(--bad); }
    .steps { list-style: none; margin: 0; padding: 0; }
    .steps li { border-top: 1px solid var(--line); padding: 8px 0; display: flex; gap: 10px; align-items: baseline; }
    .steps .body { flex: 1; min-width: 0; } .steps .time { white-space: nowrap; }
    .steps li:first-child { border-top: 0; }
    .steps .kind { display: inline-block; min-width: 92px; font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
    details summary { cursor: pointer; }
    pre { background: var(--code); border: 1px solid var(--line); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; }
    .report img, img.chart { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
    .report table { border-collapse: collapse; } .report td, .report th { border: 1px solid var(--line); padding: 4px 8px; }
    .flash { padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); margin-bottom: 12px; }
    .stat { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
    .ask { border: 2px solid var(--warn); }
    .post { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 14px; }
    table.runs { width: 100%; border-collapse: collapse; font-size: 14px; } table.runs td { padding: 6px 4px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <div><strong>Max</strong> <span class="muted small">· your analyst, with its own computer</span></div>
    <nav>
      <a href="/">Ask</a>
      <a href="/channel">#analytics</a>
      <a href="{{ ui }}/namespaces/{{ ns }}/workflows" target="_blank">Temporal UI ↗</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Countdown for approval deadlines.
    setInterval(() => {
      document.querySelectorAll("[data-deadline]").forEach(el => {
        const s = Math.max(0, Math.round((new Date(el.dataset.deadline) - new Date()) / 1000));
        el.textContent = s > 0 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} left` : "time's up";
      });
    }, 1000);
  </script>
</body>
</html>
