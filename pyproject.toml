[project]
name = "max-agent-workshop"
version = "0.1.0"
description = "Give Your Agent a Computer: Durable Sandboxes with Temporal"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "pydantic>=2",
    "openai",
    "daytona",
    "fastapi",
    "uvicorn",
    "jinja2",
    "markdown",
    "python-multipart",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_agent"]

[tool.ruff]
line-length = 120

[project.scripts]
max = "max_agent.cli:run"
max-worker = "max_agent.worker:run"
max-app = "max_agent.app.main:run"

[tool.ruff.lint.per-file-ignores]
# The starter imports what learners will need for their TODOs.
"max_agent/agent/workflow.py" = ["F401"]
